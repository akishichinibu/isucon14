# Contest-like: nginx + app on this box, MySQL elsewhere.
# One hop: bench → :443 → 127.0.0.1:8080
upstream isuapp {
  server 127.0.0.1:8080;
  keepalive 64;
}

server {
  listen 80 default_server;
  server_name _;
  index index.html;
  root /var/www/html;
  location / { try_files $uri $uri/ =404; }
}

server {
  listen 443 ssl default_server;
  server_name _;
  ssl_certificate     /etc/nginx/tls/dummy.crt;
  ssl_certificate_key /etc/nginx/tls/dummy.key;
  ssl_protocols TLSv1.3;
  root /var/www/html;
  location / { try_files $uri $uri/ =404; }
}

server {
  listen 443 ssl;
  server_name xiv.isucon.net;
  server_name *.xiv.isucon.net;

  ssl_certificate     /etc/nginx/tls/_.xiv.isucon.net.crt;
  ssl_certificate_key /etc/nginx/tls/_.xiv.isucon.net.key;
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;
  client_max_body_size 10m;
  root /home/isucon/webapp/public/;

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_pass http://isuapp;
  }

  location /api/internal/ {
    allow 127.0.0.1;
    deny all;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_pass http://isuapp;
  }
}
